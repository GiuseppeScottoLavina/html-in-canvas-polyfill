# Repo checks, types, unit tests (Node 22 and 24, headless Chrome), build, bundle check and package contents.
# The browser gates, the WPT subset, Firefox/Safari and the framework apps need headed browsers on a real, unlocked
# screen and run locally on macOS (CONTRIBUTING.md, "Browser gates").
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    # the parts that run in Node alone, on every supported major (package.json "engines": >= 22)
    name: node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Lint (repo checks, plugin folder contract)
        run: npm run lint

      - name: Types
        run: npm run check

      - name: Unit tests (Node; src and plugins/)
        run: node test/unit/lib/run-node-tests.mjs

      - name: Build
        run: npm run build

      - name: Package contents
        run: npm pack --dry-run

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Chrome (stable)
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable

      - name: Make Chrome reachable for the test harness
        # The harness looks for Chrome at the macOS path (test/harness/lib/chrome.mjs); the unit runner also takes --chrome=<path>.
        # Ubuntu 23.10+ restricts the unprivileged user namespaces Chrome's sandbox needs; re-allow them instead of using --no-sandbox. The sysctl is the one of
        # Ubuntu 24.04, which is why the runners are pinned to ubuntu-24.04 rather than ubuntu-latest.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo mkdir -p "/Applications/Google Chrome.app/Contents/MacOS"
          sudo ln -sf "${{ steps.chrome.outputs.chrome-path }}" "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          "${{ steps.chrome.outputs.chrome-path }}" --version

      - run: npm ci

      - name: Lint (repo checks, plugin folder contract)
        run: npm run lint

      - name: Types
        run: npm run check

      - name: Unit tests (Node; src and plugins/)
        run: node test/unit/lib/run-node-tests.mjs

      - name: Unit tests (headless Chrome; src and plugins/)
        run: node test/unit/run.mjs --chrome="${{ steps.chrome.outputs.chrome-path }}"

      - name: Build
        run: npm run build

      - name: Bundle check (sizes, every bundle and plugin bundle loaded in headless Chrome)
        # --allow-size: the 150 KB core target is a documented known miss (docs/BUNDLES.md); the size ceilings still fail.
        run: node scripts/check-bundle.mjs --no-build --allow-size

      - name: Package contents
        run: npm pack --dry-run
