# PROBE (first measurement of the hosted macOS runner; replaced by the real workflow once measured).
name: CI macOS

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: probe ${{ matrix.part }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: diag
            canary: 'false'
            run: |
              ls -la "/Applications/Google Chrome.app/Contents/MacOS/" || true
              xattr -l "$HIC_CHROME_PATH" || true
              codesign -dv "$(dirname "$(dirname "$(dirname "$HIC_CHROME_PATH")")")" 2>&1 | head -5 || true
              node test/ci/diag-chrome.mjs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/macos-browsers
        with:
          canary: ${{ matrix.canary }}

      - name: Run ${{ matrix.part }}
        run: |
          mkdir -p .scratch/results
          ${{ matrix.run }}

      - name: Desktop screenshot
        if: always()
        run: screencapture -x .scratch/results/desktop-end.png || true

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-${{ matrix.part }}
          path: .scratch/results
          retention-days: 7
          if-no-files-found: ignore
