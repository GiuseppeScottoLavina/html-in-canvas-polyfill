<!doctype html><html><head><meta charset="utf-8"><title>regress: canvas.width write inside onpaint (M3)</title>
<script>var q = new URLSearchParams(location.search); window.__q = q; if (q.get("bundle")) document.write("<scr" + "ipt src=\"" + q.get("bundle") + "\"></scr" + "ipt>");</script>
<style>body{margin:8px;background:#fff} #c{display:block;width:300px;height:160px}</style></head><body>
<canvas id="c" width="300" height="160" content="drawable"><div id="a" drawable style="width:100px;height:40px;background:#c33"></div></canvas>
<script>
  const canvas = document.getElementById('c'); const ctx = canvas.getContext('2d');
  window.__paints = 0;
  canvas.addEventListener('paint', () => { window.__paints++; });
  // loop=1 (control): the handler also asks for another paint every time, a REAL paint loop
  canvas.onpaint = () => { canvas.width = 200; ctx.drawElementImage(document.getElementById('a'), 0, 0); if (window.__q.get('loop') === '1') canvas.requestPaint(); };
</script></body></html>
