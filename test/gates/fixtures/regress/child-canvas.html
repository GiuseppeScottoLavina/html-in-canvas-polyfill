<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>regress: script-redrawn child canvas (browser M4)</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.5 system-ui,sans-serif;background:#fff}
.page{padding:16px}
#hic-surface{display:block;width:400px;height:200px;background:#fff}
.s{width:100%;height:100%;padding:12px;background:#f4f4fa}
#inner{display:block;width:200px;height:80px;background:#fff}
</style></head>
<body><div class="page">
<canvas id="hic-surface" width="400" height="200" content="drawable"><div class="s" drawable><p style="margin:0 0 8px">chart below</p><canvas id="inner" width="200" height="80"></canvas></div></canvas>
</div>
<script src="/test/fixtures/shared/boot.js"></script>
<script>
  // the inner canvas is drawn by SCRIPT (a chart library would); no DOM mutation, no attribute change: only the bitmap changes
  window.__drawInner = (color) => { const x = document.getElementById('inner').getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, 200, 80); x.fillStyle = color; x.fillRect(10, 10, 120, 40); x.fillStyle = '#222'; x.fillRect(10, 60, 180, 6); };
  window.__drawInner('#d33');
</script></body></html>
