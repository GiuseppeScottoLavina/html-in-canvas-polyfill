<!doctype html><html><head><meta charset="utf-8"><title>regress: a 60 Hz counter in proportional digits paints at the display rate (M5)</title>
<script>var q = new URLSearchParams(location.search); window.__q = q;
  // control: every snapshot decode is held 60 ms (a renderer that paints rarely), so the rate checks must go red
  // slow=1 (positive control): every snapshot image is held 60 ms. A data: SVG that the engine loads at once is used without decode() (store/decode.js), so `complete`
  // also reads false for it until its held decode() resolved: every tile then takes the slow path.
  if (q.get("slow") === "1") (function (P) { var d = P.decode; var c = Object.getOwnPropertyDescriptor(P, 'complete'); var held = new WeakSet();

<style>body{margin:8px;background:#fff} #c{display:block;width:420px;height:160px}
  #d{width:400px;height:140px;color:#111;display:flex;align-items:center;justify-content:center;gap:12px}
  #d.opaque{background:#f4efe6}
  #d.inline{display:block;font:20px sans-serif}
  #n{font:700 64px Georgia,serif}
  #n.impact{font:64px Impact,sans-serif}
  #n.tabular{font:700 64px Georgia,serif;font-variant-numeric:tabular-nums lining-nums}
  #n.mono{font:700 64px ui-monospace,Menlo,monospace}</style></head><body>
<canvas id="c" content="drawable"><div id="d" drawable><span id="label">score</span><span id="n">0</span><span>pts</span></div></canvas>
<script>
  // A counter whose text changes at 60 Hz. With proportional digits (Georgia, Impact) its box changes width on most changes; the flex row re-centres, so the
  // siblings move too. font=georgia|impact|tabular|mono, bg=transparent|opaque, layout=flex|inline, effect=1 runs the WebGPU effects host instead of a 2D onpaint.
  const canvas = document.getElementById('c'); const d = document.getElementById('d'); const n = document.getElementById('n');
  n.className = q.get('font') || 'georgia';
  if (q.get('bg') === 'opaque') d.classList.add('opaque');
  if (q.get('layout') === 'inline') { d.classList.add('inline'); d.replaceChildren(document.createTextNode('score '), n, document.createTextNode(' pts')); }
  if (q.get('init')) n.textContent = q.get('init');
  // filler=N: N more nodes in the drawable after the counter (a large drawable: a whole-drawable rebuild costs O(N))
  if (+q.get('filler')) { d.style.flexWrap = 'wrap'; d.style.height = 'auto'; d.style.overflow = 'hidden'; d.style.maxHeight = '600px'; const f = document.createElement('div'); f.style.cssText = 'width:100%;font:9px sans-serif;color:#555'; for (let k = 0; k < +q.get('filler'); k++) { const s = document.createElement('span'); s.textContent = 'cell ' + k + ' '; f.append(s); } d.append(f); }
  window.__paints = 0; window.__changed = 0; window.__errors = [];
  let ctx = null; let lastSum = -1;
  // the counter's area of the canvas bitmap: a paint "changed" when its checksum differs from the previous paint's
  function checksum() {
    const s = devicePixelRatio, a = ctx.getImageData(100 * s, 30 * s, 220 * s, 100 * s).data;
    let h = 0; for (let k = 0; k < a.length; k += 4) h = (h * 31 + a[k] + 7 * a[k + 1] + 13 * a[k + 2] + 17 * a[k + 3]) | 0;
    return h;
  }
  if (q.get('effect') !== '1') {
    ctx = canvas.getContext('2d', { willReadFrequently: true });
    canvas.width = 420 * devicePixelRatio; canvas.height = 160 * devicePixelRatio;
    canvas.onpaint = () => {
      window.__paints++;
      try { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawElementImage(d, 0, 0); } catch (e) { window.__errors.push(String(e)); }
      const sum = checksum(); if (sum !== lastSum) { window.__changed++; lastSum = sum; }
    };
  }
  window.__startEffect = async () => {
    const host = await HTMLInCanvasEffects.createHost(canvas, d, { maxDpr: 2.5, interposer: false });
    window.__host = host;

    return true;
  };

  let i = 0;
  window.__run = (ms) => new Promise((resolve) => {
    const stats = () => (window.__HIC__ && __HIC__.installed && (__HIC__.installed.report().canvases[0] || {stats: {}}).stats.snapshot) || {};
    const up = () => (window.__host ? window.__host.stats().uploads : 0);
    const s0 = stats(), p0 = window.__paints, c0 = window.__changed, u0 = up();
    const t0 = performance.now(); let next = t0;
    function frame(now) {
      if (now >= next) { i++; n.firstChild.data = String(i * 7 % 10000); next += 1000 / 60; if (next < now) next = now + 1000 / 60; }
      if (now - t0 < ms) { requestAnimationFrame(frame); return; }
      const s1 = stats(), sec = (now - t0) / 1000;
      const delta = {}; for (const k of ['commits', 'tiles', 'fullTiles', 'dropped', 'redamaged']) delta[k] = (s1[k] || 0) - (s0[k] || 0);
      resolve({ changes: i, paintsPerSec: (window.__paints - p0) / sec, changedPerSec: (window.__changed - c0) / sec, uploadsPerSec: (up() - u0) / sec, store: delta, text: n.textContent, errors: window.__errors });
    }
    requestAnimationFrame(frame);
  });
  // the canvas bitmap after the last change has painted (2D only), as base64 RGBA
  window.__pixels = async () => {
    await new Promise((r) => setTimeout(r, 700));
    const a = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    let bin = ''; for (let k = 0; k < a.length; k += 8192) bin += String.fromCharCode.apply(null, a.subarray(k, k + 8192));
    return { px: btoa(bin), w: canvas.width, h: canvas.height, text: n.textContent, errors: window.__errors };
  };
</script></body></html>
