<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="icon" href="data:,">
<title>scroll covers: what paints over a composed list, and a sticky header that changes</title>
<script>
  // ?bundle=<core>  run(mode) installs the polyfill, plans the list (one scroll step of 1 px, its pages built), applies the mode's change, scrolls the list from 1 to
  // 40 css px and compares the canvas in the paint that follows that step with the settled canvas half a second later. Modes:
  //   plain         (control) nothing over the list: the step is composed
  //   over          a sibling of the list with pointer-events: none paints over its port (the hit-test grid cannot see it): not composed
  //   over-late     the same box, transparent while the list is planned, gets its background after: not composed
  //   row-late      (control) a row of the list changes after the plan (a box with pointer-events: none rests beside the port): composed
  //   head          (control) a sticky header that stays opaque, its text changed after the plan: composed
  //   head-half     the sticky header turns opacity: 0.5 after the plan: not composed
  //   head-auto     (control) a sticky header without a z-index, nothing else of the list in its layer: composed
  //   head-auto-row a sticky header without a z-index and a first row of position: relative, which the engine paints over it where it scrolls under: not composed
  //   head-auto-layer  the same with a first row of opacity 0.9 (a stacking context of its own, painted with the header's layer): not composed
  //   head-auto-late   a sticky header without a z-index whose first row gets opacity 0.9 after the plan (a :hover transition, say): the plan is stale, not composed
  //   sentinel      the box has the background of the cover check's first colour, rgb(1, 254, 3): not composed (scroll-compose.js vet, the second colour)
  //   sentinel-alpha   the same colour at alpha 0.5: not composed
  //   sentinel-near    a colour one level off, rgb(2, 254, 3): not composed
  //   sentinel-second  the cover check's second colour, rgb(254, 1, 252): not composed
  //   round         (control) the list with rounded corners, nothing over it: composed
  //   sentinel-round   the rounded list under a box of the first cover colour: not composed
  //   hidden-row    (control) the opaque box over the port has opacity: 0 (it paints nothing), a row under it changes after the plan: composed
  //   hidden-parent-row  (control) the same with opacity: 0 on a wrapper of the box (its effective opacity): composed
  //   hidden-shown  the box of opacity: 0 turns opacity: 1 after the plan: not composed
  //   hidden-faint  the box of opacity: 0 turns opacity: 0.02 after the plan (5 levels, under the pixel tolerance): not composed
  //   hidden-parent-shown  the wrapper of opacity: 0 turns opacity: 1 after the plan: not composed
  // Blend modes, over rows of blue and navy (navy is barely saturated): a box outside the list composited with the list beneath it (mix-blend-mode) changes the rows
  // under it and may leave a uniform colour as it is, so the cover check alone does not see it (rgb(1, 254, 3) under saturation leaves both cover colours unchanged):
  //   blend-none    (control) the blue and navy rows, nothing over them: composed
  //   blend-saturation  the box of the first cover colour with mix-blend-mode: saturation over the port: not composed
  //   blend-multiply / blend-difference / blend-luminosity  magenta boxes in those modes: not composed
  //   blend-parent  the box (normal) inside a transparent wrapper of its size with mix-blend-mode: saturation (the wrapper paints nothing itself): not composed
  //   blend-pseudo  a transparent box without a stacking context whose ::before is the first cover colour with mix-blend-mode: saturation: not composed
  //   blend-partial the blended box half over the port, half below it: not composed
  //   blend-off     (control) the blended box below the port, outside it: composed
  //   blend-hidden / blend-invisible / blend-transparent  (controls) the blended box of opacity: 0, of visibility: hidden, with no background: composed
  //   blend-late    the blended box transparent while the list is planned, of the first cover colour after: not composed
  //   backdrop-blur (control) a transparent box with backdrop-filter: blur(6px) over the port, which the snapshot does not paint: composed
  var q = new URLSearchParams(location.search);
  if (q.get('bundle')) document.write('<scr' + 'ipt src="' + q.get('bundle') + '" data-hic-manual></scr' + 'ipt>');
</script>
<style>
  body { margin: 20px; }
  canvas { display: block; width: 400px; height: 260px; }
  .d { position: relative; width: 400px; height: 260px; background: white; font: 14px Arial, sans-serif; }
  .list { height: 240px; overflow: auto; position: relative; scrollbar-width: none; background: white; }
  .row { height: 30px; box-sizing: border-box; }
  .row:nth-child(2n) { background: rgb(0, 255, 0); }
  .row:nth-child(2n+1) { background: rgb(0, 0, 255); }
  .box { position: absolute; left: 0; top: 60px; width: 400px; height: 30px; z-index: 5; pointer-events: none; background: rgb(255, 0, 255); }
  .wrap { position: absolute; left: 0; top: 0; width: 0; height: 0; opacity: 0; }
  .list.round { border-radius: 12px; }
  .list.navy .row:nth-child(2n+1) { background: rgb(30, 40, 60); }
  .box.pb { z-index: auto; background: transparent; }
  .box.pb::before { content: ''; position: absolute; inset: 0; background: rgb(1, 254, 3); mix-blend-mode: saturation; }
  .head { position: sticky; top: 0; z-index: 2; height: 30px; background: rgb(255, 0, 255); color: black; box-sizing: border-box; }
</style></head>
<body>
<canvas id="c" content="drawable" width="400" height="260"><div class="d" drawable><div class="list"></div></div></canvas>
<script>
  const MODES = {
    plain: {},
    over: { box: '' },
    'over-late': { box: 'background:transparent', after: (d) => { d.querySelector('.box').style.background = 'rgb(255, 0, 255)'; } },
    'row-late': { box: 'top:242px;height:18px', after: (d) => { d.querySelectorAll('.row')[3].style.background = 'rgb(255, 128, 0)'; } },
    head: { head: true, after: (d) => { d.querySelector('.head').textContent = 'HEADER 2'; } },
    'head-half': { head: true, after: (d) => { d.querySelector('.head').style.opacity = '0.5'; } },
    'head-auto': { head: true, before: (d) => { d.querySelector('.head').style.zIndex = 'auto'; } },
    'head-auto-row': { head: true, before: (d) => { d.querySelector('.head').style.zIndex = 'auto'; d.querySelector('.row').style.position = 'relative'; } },
    'head-auto-layer': { head: true, before: (d) => { d.querySelector('.head').style.zIndex = 'auto'; d.querySelector('.row').style.opacity = '0.9'; } },
    'head-auto-late': { head: true, before: (d) => { d.querySelector('.head').style.zIndex = 'auto'; }, after: (d) => { d.querySelector('.row').style.opacity = '0.9'; } },
    sentinel: { box: 'background:rgb(1, 254, 3)' },
    'sentinel-alpha': { box: 'background:rgba(1, 254, 3, 0.5)' },
    'sentinel-near': { box: 'background:rgb(2, 254, 3)' },
    'sentinel-second': { box: 'background:rgb(254, 1, 252)' },
    round: { round: true },
    'sentinel-round': { round: true, box: 'background:rgb(1, 254, 3)' },
    'hidden-row': { box: 'opacity:0', after: (d) => { d.querySelectorAll('.row')[2].style.background = 'rgb(255, 128, 0)'; } },
    'hidden-parent-row': { box: '', wrap: true, after: (d) => { d.querySelectorAll('.row')[2].style.background = 'rgb(255, 128, 0)'; } },
    'hidden-shown': { box: 'opacity:0', after: (d) => { d.querySelector('.box').style.opacity = '1'; } },
    'hidden-faint': { box: 'opacity:0', after: (d) => { d.querySelector('.box').style.opacity = '0.02'; } },
    'hidden-parent-shown': { box: '', wrap: true, after: (d) => { d.querySelector('.wrap').style.opacity = '1'; } },
    'blend-none': { navy: true },
    'blend-saturation': { navy: true, box: 'background:rgb(1, 254, 3);mix-blend-mode:saturation' },
    'blend-multiply': { navy: true, box: 'mix-blend-mode:multiply' },
    'blend-difference': { navy: true, box: 'mix-blend-mode:difference' },
    'blend-luminosity': { navy: true, box: 'mix-blend-mode:luminosity' },
    'blend-parent': { navy: true, box: 'background:rgb(1, 254, 3);top:0', wrap: 'opacity:1;mix-blend-mode:saturation;top:60px;width:400px;height:30px;pointer-events:none' },
    'blend-pseudo': { navy: true, box: '', cls: 'pb' },
    'blend-partial': { navy: true, box: 'background:rgb(1, 254, 3);mix-blend-mode:saturation;top:225px' },
    'blend-off': { navy: true, box: 'background:rgb(1, 254, 3);mix-blend-mode:saturation;top:242px;height:18px' },
    'blend-hidden': { navy: true, box: 'background:rgb(1, 254, 3);mix-blend-mode:saturation;opacity:0' },
    'blend-invisible': { navy: true, box: 'background:rgb(1, 254, 3);mix-blend-mode:saturation;visibility:hidden' },
    'blend-transparent': { navy: true, box: 'background:transparent;mix-blend-mode:saturation' },
    'blend-late': { navy: true, box: 'background:transparent;mix-blend-mode:saturation', after: (d) => { d.querySelector('.box').style.background = 'rgb(1, 254, 3)'; } },
    'backdrop-blur': { navy: true, box: 'background:transparent;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)' },
  };
  window.run = async (mode) => {
    const m = MODES[mode];
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    const canvas = document.getElementById('c'), ctx = canvas.getContext('2d'), d = document.querySelector('.d'), list = document.querySelector('.list');
    list.innerHTML = (m.head ? '<div class="head">HEADER</div>' : '') + Array.from({ length: 120 }, (_, i) => '<div class="row">row ' + i + '</div>').join('');
    if (m.round) list.classList.add('round');
    if (m.navy) list.classList.add('navy');
    if (m.box !== undefined) d.insertAdjacentHTML('beforeend', (m.wrap ? '<div class="wrap" style="' + (m.wrap === true ? '' : m.wrap) + '">' : '') + '<div class="box' + (m.cls ? ' ' + m.cls : '') + '" style="' + m.box + '"></div>' + (m.wrap ? '</div>' : ''));
    m.before?.(d);
    const installed = HicLivePolyfill.install({ maxDpr: 1 });
    canvas.onpaint = () => { ctx.reset(); ctx.drawElementImage(d, 0, 0); };
    canvas.requestPaint();
    await installed.whenPainted(canvas);
    const scroll = () => JSON.parse(JSON.stringify(installed.report().canvases[0].stats.snapshot.scroll));
    try {
      // the elements a mode changes are seen changed once first (the first change of an element damages the whole drawable, which plans the list again)
      for (const el of [...d.querySelectorAll('.head, .box, .wrap, .row:nth-child(3), .row:nth-child(4)'), d.querySelector('.row')]) if (el) el.dataset.seen = '1';
      await wait(400);
      list.scrollTop = 1;
      for (let n = 0; n < 100; n++) { await wait(30); const s = scroll(); if (s.pages >= 2 || s.refusals > 0) { await wait(300); break; } }
      const planned = scroll();
      if (m.after) { m.after(d); await wait(500); }
      const pixels = () => ctx.getImageData(0, 0, 400, 260).data;
      const first = await new Promise((resolve, reject) => {
        const c0 = scroll().composed;
        const timer = setTimeout(() => reject(new Error('no paint after the scroll step')), 5000);
        canvas.addEventListener('paint', () => { clearTimeout(timer); setTimeout(() => resolve({ composed: scroll().composed - c0, px: pixels() }), 0); }, { once: true });
        list.scrollTop = 40;
      });
      await wait(500);
      const settled = pixels();
      let bad = 0, max = 0, nonWhite = 0, arcBad = 0, arcMax = 0;
      // a rounded list: its four corner squares (12 css px, the list's port at 0,0 400 x 240), where the compositor's clip antialiases the arc, are counted apart
      const arc = (i) => { const x = i % 400, y = (i - x) / 400; return !!m.round && (x < 12 || x >= 388) && (y < 12 || (y >= 228 && y < 240)); };
      for (let p = 0; p < settled.length; p += 4) {
        let delta = 0;
        for (let k = 0; k < 4; k++) delta = Math.max(delta, Math.abs(first.px[p + k] - settled[p + k]));
        if (arc(p / 4)) { if (delta > 16) arcBad++; arcMax = Math.max(arcMax, delta); continue; }
        if (delta > 16) bad++;
        max = Math.max(max, delta);
        if (settled[p] < 250 || settled[p + 1] < 250 || settled[p + 2] < 250) nonWhite++;
      }
      // the settled canvas under the box's place (row 2, navy in the blend modes): the snapshot paints the blend there
      const under = Array.from(settled.slice((75 * 400 + 100) * 4, (75 * 400 + 100) * 4 + 4));
      return { mode, composed: first.composed, bad, max, arcBad, arcMax, nonWhite, under, total: 400 * 260, planned, after: scroll() };
    } finally { installed.uninstall(); }
  };
  window.__ready = true;
</script>
</body></html>
