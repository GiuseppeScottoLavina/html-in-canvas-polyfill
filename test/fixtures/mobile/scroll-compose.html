<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile fixture: composed scrolling</title>
<!-- The mobile gate's scrollCompose scenario (test/mobile/scenarios.mjs): two inner scrollers the scroll compositor composes, laid out on fractional css px (a 1fr / 1.3fr
     grid, rows 36.6 px tall, a 7.4 px offset), so that their edges and offsets fall between the device pixels of a DPR 3 phone.
     #round: rounded, bordered, opaque, with a sticky header (the scroll-and-resize example's inbox). #square: square, transparent (over the white root), with a sticky header.
     ?mode=ref|poly&bundle=... (shared/boot.js); ?badges=square: square badges (G-xbrowser scrollCompose: Gecko composes no content with rounded corners); ?bars=none: scrollbar-width none on the lists
     (no gutter whatever the system's scrollbars: Gecko composes no scroller with a classic bar) -->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #eef1f6; color: #1b2330; font: 14px/1.4 system-ui, -apple-system, sans-serif; }
  #hic-surface { display: block; width: 100%; height: 520px; background: #fff; }
  #root { width: 100%; height: 100%; display: grid; grid-template-columns: 1fr 1.3fr; gap: 10px; padding: 12px; background: #fff; }
  .list { min-height: 0; overflow-y: auto; }
  .list header { position: sticky; top: 0; z-index: 1; padding: 8px 10px; font-weight: 700; background: #e6ecf7; border-bottom: 1px solid #c9d1de; }
  .list ol { margin: 0; padding: 0; list-style: none; }
  .list li { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid #e6eaf2; white-space: nowrap; overflow: hidden; }
  .list li b { min-width: 24px; text-align: center; border-radius: 6px; color: #fff; font-size: 12px; }
  #round { border: 1px solid #c9d1de; border-radius: 10px; background: #fbfcfe; }
  #square { margin-top: 7.4px; border-top: 1px solid #9aa4b8; }
</style></head>
<body>
<canvas id="hic-surface" content="drawable" aria-label="Composed scrolling fixture">
  <div id="root" drawable>
    <section id="round" class="list"><header>Rounded</header><ol></ol></section>
    <section id="square" class="list"><header>Square</header><ol></ol></section>
  </div>
</canvas>
<div style="height:900px"></div>
<script>
  const fq = new URLSearchParams(location.search);
  if (fq.get('badges') === 'square') document.head.insertAdjacentHTML('beforeend', '<style>.list li b { border-radius: 0; }</style>');
  if (fq.get('bars') === 'none') document.head.insertAdjacentHTML('beforeend', '<style>.list { scrollbar-width: none; }</style>');
  for (const ol of document.querySelectorAll('.list ol')) {
    let html = '';
    for (let i = 0; i < 60; i++) html += `<li><b style="background:hsl(${(i * 37) % 360} 65% 42%)">${i}</b><span>Row ${i} amber fjord kelp</span></li>`;
    ol.innerHTML = html;
  }
</script>
<script src="/test/fixtures/shared/boot.js"></script>
</body></html>
